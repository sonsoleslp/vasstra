<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    text { fill: #334155; }
    .title { font-size: 23px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; fill: #64748b; }
    .hdr { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
    .hdrsub { font-size: 11.5px; fill: #64748b; }
    .fam { font-size: 13.5px; font-weight: 700; fill: #1e293b; }
    .meth { font-size: 12px; fill: #334155; }
    .key { font-weight: 600; fill: #0f172a; }
    .pkg { font-size: 10.5px; fill: #94a3b8; }
  </style>

  <rect width="980" height="470" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" class="title">Clustering algorithms in VaSSTra</text>
  <text x="490" y="56" text-anchor="middle" class="subtitle">VaSSTra clusters twice: observations into states, then sequences into trajectories</text>

  <!-- ==================== LEFT: STATES ==================== -->
  <rect x="24" y="76" width="460" height="376" rx="12" fill="#f8fafc" stroke="#e6eaf0"/>
  <rect x="24" y="76" width="7" height="376" rx="3.5" fill="#0072B2"/>
  <text x="50" y="108" class="hdr" fill="#0072B2">STATES</text>
  <text x="50" y="126" class="hdrsub">multivariate observations &#8594; profiles &#183; step 1</text>
  <line x1="50" y1="138" x2="468" y2="138" stroke="#e6eaf0"/>

  <!-- Row A: Model-based (Gaussian mixture) -->
  <g transform="translate(48,154)">
    <ellipse cx="24" cy="24" rx="17" ry="12" fill="#0072B2" fill-opacity=".08" stroke="#0072B2" stroke-opacity=".55" stroke-width="1.2"/>
    <ellipse cx="72" cy="20" rx="16" ry="11" fill="#D55E00" fill-opacity=".08" stroke="#D55E00" stroke-opacity=".55" stroke-width="1.2"/>
    <ellipse cx="48" cy="54" rx="18" ry="11" fill="#009E73" fill-opacity=".08" stroke="#009E73" stroke-opacity=".55" stroke-width="1.2"/>
    <g fill="#0072B2"><circle cx="17" cy="20" r="1.8"/><circle cx="28" cy="19" r="1.8"/><circle cx="22" cy="28" r="1.8"/><circle cx="31" cy="27" r="1.8"/><circle cx="20" cy="25" r="1.8"/></g>
    <g fill="#D55E00"><circle cx="66" cy="17" r="1.8"/><circle cx="77" cy="17" r="1.8"/><circle cx="72" cy="25" r="1.8"/><circle cx="80" cy="22" r="1.8"/><circle cx="68" cy="23" r="1.8"/></g>
    <g fill="#009E73"><circle cx="41" cy="52" r="1.8"/><circle cx="54" cy="53" r="1.8"/><circle cx="48" cy="58" r="1.8"/><circle cx="44" cy="49" r="1.8"/><circle cx="55" cy="49" r="1.8"/></g>
  </g>
  <text x="164" y="172" class="fam">Model-based</text>
  <text x="164" y="192" class="meth"><tspan class="key">LPA</tspan>: Gaussian mixture, soft assignment, BIC</text>
  <text x="164" y="208" class="pkg">latents &#183; default state method</text>

  <!-- Row B: Partitioning (centroids / medoids) -->
  <g transform="translate(48,246)">
    <g fill="#0072B2"><circle cx="17" cy="20" r="1.8"/><circle cx="28" cy="19" r="1.8"/><circle cx="22" cy="28" r="1.8"/><circle cx="31" cy="27" r="1.8"/><circle cx="20" cy="25" r="1.8"/></g>
    <g fill="#D55E00"><circle cx="66" cy="17" r="1.8"/><circle cx="77" cy="17" r="1.8"/><circle cx="72" cy="25" r="1.8"/><circle cx="80" cy="22" r="1.8"/><circle cx="68" cy="23" r="1.8"/></g>
    <g fill="#009E73"><circle cx="41" cy="52" r="1.8"/><circle cx="54" cy="53" r="1.8"/><circle cx="48" cy="58" r="1.8"/><circle cx="44" cy="49" r="1.8"/><circle cx="55" cy="49" r="1.8"/></g>
    <circle cx="24" cy="24" r="4.6" fill="#fff" stroke="#0072B2" stroke-width="2.2"/>
    <circle cx="73" cy="21" r="4.6" fill="#fff" stroke="#D55E00" stroke-width="2.2"/>
    <circle cx="48" cy="53" r="4.6" fill="#fff" stroke="#009E73" stroke-width="2.2"/>
  </g>
  <text x="164" y="264" class="fam">Partitioning</text>
  <text x="164" y="284" class="meth"><tspan class="key">k-means</tspan>, <tspan class="key">PAM</tspan>, <tspan class="key">CLARA</tspan>, <tspan class="key">FANNY</tspan></text>
  <text x="164" y="300" class="pkg">stats::kmeans &#183; cluster (medoid, sampled, fuzzy)</text>

  <!-- Row C: Hierarchical (dendrogram with cut) -->
  <g transform="translate(48,344)">
    <g stroke="#0072B2" stroke-width="1.7" fill="none">
      <path d="M14,66 V46 M30,66 V46 M14,46 H30 M22,46 V34 M46,66 V34 M22,34 H46"/>
    </g>
    <g stroke="#D55E00" stroke-width="1.7" fill="none">
      <path d="M62,66 V50 M78,66 V50 M62,50 H78"/>
    </g>
    <g stroke="#64748b" stroke-width="1.7" fill="none">
      <path d="M34,34 V20 M70,50 V20 M34,20 H70"/>
    </g>
    <line x1="6" y1="27" x2="88" y2="27" stroke="#e01a4f" stroke-width="1.3" stroke-dasharray="4 3"/>
  </g>
  <text x="164" y="360" class="fam">Hierarchical</text>
  <text x="164" y="380" class="meth">Agglomerative: ward.D2, ward.D, complete,</text>
  <text x="164" y="396" class="meth">average, single, mcquitty, median, centroid</text>
  <text x="164" y="411" class="pkg">stats::hclust, cut at n_states</text>
  <text x="164" y="432" class="meth">Divisive: <tspan class="key">DIANA</tspan> <tspan class="pkg">(cluster)</tspan></text>

  <!-- ==================== RIGHT: TRAJECTORIES ==================== -->
  <rect x="496" y="76" width="460" height="376" rx="12" fill="#f8fafc" stroke="#e6eaf0"/>
  <rect x="496" y="76" width="7" height="376" rx="3.5" fill="#D55E00"/>
  <text x="522" y="108" class="hdr" fill="#D55E00">TRAJECTORIES</text>
  <text x="522" y="126" class="hdrsub">whole state sequences &#8594; groups &#183; step 3</text>
  <line x1="522" y1="138" x2="940" y2="138" stroke="#e6eaf0"/>

  <!-- Section 1: dissimilarity (two aligned sequences) -->
  <text x="522" y="166" class="fam">1 &#183; Dissimilarity: how two sequences differ</text>
  <g transform="translate(522,182)">
    <g>
      <rect x="0" y="0" width="15" height="15" rx="2" fill="#0072B2"/>
      <rect x="18" y="0" width="15" height="15" rx="2" fill="#0072B2"/>
      <rect x="36" y="0" width="15" height="15" rx="2" fill="#D55E00"/>
      <rect x="54" y="0" width="15" height="15" rx="2" fill="#009E73"/>
      <rect x="72" y="0" width="15" height="15" rx="2" fill="#009E73"/>
      <rect x="90" y="0" width="15" height="15" rx="2" fill="#D55E00"/>
    </g>
    <g stroke-width="1.4">
      <line x1="7.5" y1="16" x2="7.5" y2="39" stroke="#cbd5e1"/>
      <line x1="25.5" y1="16" x2="25.5" y2="39" stroke="#e01a4f" stroke-dasharray="3 2"/>
      <line x1="43.5" y1="16" x2="43.5" y2="39" stroke="#cbd5e1"/>
      <line x1="61.5" y1="16" x2="61.5" y2="39" stroke="#cbd5e1"/>
      <line x1="79.5" y1="16" x2="79.5" y2="39" stroke="#e01a4f" stroke-dasharray="3 2"/>
      <line x1="97.5" y1="16" x2="97.5" y2="39" stroke="#cbd5e1"/>
    </g>
    <g>
      <rect x="0" y="40" width="15" height="15" rx="2" fill="#0072B2"/>
      <rect x="18" y="40" width="15" height="15" rx="2" fill="#D55E00"/>
      <rect x="36" y="40" width="15" height="15" rx="2" fill="#D55E00"/>
      <rect x="54" y="40" width="15" height="15" rx="2" fill="#009E73"/>
      <rect x="72" y="40" width="15" height="15" rx="2" fill="#0072B2"/>
      <rect x="90" y="40" width="15" height="15" rx="2" fill="#D55E00"/>
    </g>
  </g>
  <text x="648" y="196" class="meth"><tspan class="key">hamming</tspan>: position mismatch</text>
  <text x="648" y="214" class="meth"><tspan class="key">LCS</tspan>: longest common subsequence</text>
  <text x="648" y="232" class="meth"><tspan class="key">OSA, LV, DL</tspan>: edit distances</text>
  <text x="648" y="250" class="meth"><tspan class="key">q-gram</tspan>: shared length-q substrings</text>
  <text x="648" y="268" class="meth"><tspan class="key">cosine, jaccard</tspan>: q-gram overlap</text>
  <text x="648" y="286" class="meth"><tspan class="key">jw</tspan>: Jaro-Winkler prefix similarity</text>

  <!-- Section 2: cluster the distances (grouped sequences) -->
  <text x="522" y="336" class="fam">2 &#183; Cluster the distances into groups</text>
  <g transform="translate(522,350)">
    <rect x="-4" y="-3" width="118" height="43" rx="5" fill="none" stroke="#0072B2" stroke-opacity=".5" stroke-dasharray="3 2"/>
    <g>
      <rect x="2" y="2" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="16" y="2" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="30" y="2" width="12" height="8" rx="1.5" fill="#009E73"/><rect x="44" y="2" width="12" height="8" rx="1.5" fill="#009E73"/><rect x="58" y="2" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="72" y="2" width="12" height="8" rx="1.5" fill="#009E73"/><rect x="86" y="2" width="12" height="8" rx="1.5" fill="#0072B2"/>
      <rect x="2" y="13" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="16" y="13" width="12" height="8" rx="1.5" fill="#009E73"/><rect x="30" y="13" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="44" y="13" width="12" height="8" rx="1.5" fill="#009E73"/><rect x="58" y="13" width="12" height="8" rx="1.5" fill="#009E73"/><rect x="72" y="13" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="86" y="13" width="12" height="8" rx="1.5" fill="#009E73"/>
      <rect x="2" y="24" width="12" height="8" rx="1.5" fill="#009E73"/><rect x="16" y="24" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="30" y="24" width="12" height="8" rx="1.5" fill="#009E73"/><rect x="44" y="24" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="58" y="24" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="72" y="24" width="12" height="8" rx="1.5" fill="#009E73"/><rect x="86" y="24" width="12" height="8" rx="1.5" fill="#0072B2"/>
    </g>
    <rect x="-4" y="44" width="118" height="32" rx="5" fill="none" stroke="#D55E00" stroke-opacity=".5" stroke-dasharray="3 2"/>
    <g>
      <rect x="2" y="49" width="12" height="8" rx="1.5" fill="#D55E00"/><rect x="16" y="49" width="12" height="8" rx="1.5" fill="#D55E00"/><rect x="30" y="49" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="44" y="49" width="12" height="8" rx="1.5" fill="#D55E00"/><rect x="58" y="49" width="12" height="8" rx="1.5" fill="#D55E00"/><rect x="72" y="49" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="86" y="49" width="12" height="8" rx="1.5" fill="#D55E00"/>
      <rect x="2" y="60" width="12" height="8" rx="1.5" fill="#D55E00"/><rect x="16" y="60" width="12" height="8" rx="1.5" fill="#0072B2"/><rect x="30" y="60" width="12" height="8" rx="1.5" fill="#D55E00"/><rect x="44" y="60" width="12" height="8" rx="1.5" fill="#D55E00"/><rect x="58" y="60" width="12" height="8" rx="1.5" fill="#D55E00"/><rect x="72" y="60" width="12" height="8" rx="1.5" fill="#D55E00"/><rect x="86" y="60" width="12" height="8" rx="1.5" fill="#0072B2"/>
    </g>
  </g>
  <text x="648" y="368" class="meth"><tspan class="key">PAM</tspan>: medoids, outlier-resistant</text>
  <text x="648" y="386" class="meth"><tspan class="key">Agglomerative linkages</tspan>: ward.D2, ...</text>
  <text x="648" y="404" class="pkg">via Nestimate &#183; base backend: hamming + LCS</text>
</svg>
